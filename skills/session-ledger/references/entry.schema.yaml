# JSON Schema (YAML encoding) for one session-ledger day file.
# Validators that accept YAML can load this as the document schema.
$schema: https://json-schema.org/draft/2020-12/schema
title: SessionLedgerDay
type: object
required: [date, entries]
additionalProperties: false
properties:
  schema_version:
    type: integer
    const: 1
    description: Ledger schema version. Omit for v1-compatible files.
  date:
    type: string
    pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
    description: Calendar day of this file (YYYY-MM-DD).
  entries:
    type: array
    items:
      $ref: "#/$defs/entry"

$defs:
  timestamp:
    type: string
    format: date-time
    pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(?:\\.[0-9]+)?(?:Z|[+-][0-9]{2}:[0-9]{2})$"
    description: ISO-8601 timestamp with an explicit offset (Z or ±HH:MM).

  entry:
    type: object
    required:
      - id
      - session_id
      - timestamp
      - since_t0
      - duration_sec
      - tokens
      - user_request
      - requested_model
      - chosen_variant
      - used_model
      - cost
      - outcome
    additionalProperties: false
    properties:
      id:
        type: string
        pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}-[0-9]{2}-[0-9]{2}Z-[A-Za-z0-9]{4,}$"
        description: Unique within the day; UTC stamp plus a short suffix.
      session_id:
        type: string
        minLength: 1
        description: Stable id for the agent conversation/session.
      session_started_at:
        anyOf:
          - $ref: "#/$defs/timestamp"
          - type: "null"
        description: When the session started (T0), if known; null/omit if unknown.
      host:
        type: string
        description: Host/agent that produced the entry (cursor, claude-code, codex, gemini-cli, …).
      timestamp:
        $ref: "#/$defs/timestamp"
      since_t0:
        type: string
        description: >-
          Offset of this turn's start from T0 (session start), e.g.
          "T0 + 0s", "T0 + 20m50s", "T0 + 1h05m12s", bare "T0", or "unknown".
        pattern: "^(T0|T0 \\+ (?:[1-9][0-9]*h(?:[0-5]?[0-9]m(?:[0-5]?[0-9]s)?)?|(?:[1-9]|[1-5][0-9])m(?:[0-5]?[0-9]s)?|(?:0|[1-9]|[1-5][0-9])s)|unknown)$"
      duration_sec:
        type: ["integer", "null"]
        minimum: 0
        description: Wall-clock turn duration in whole seconds, or null if unknown.
      tokens:
        type: object
        required: [input, output]
        additionalProperties: false
        properties:
          input:
            type: ["integer", "null"]
            minimum: 0
            description: Prompt / input token count for the turn, or null if unknown.
          output:
            type: ["integer", "null"]
            minimum: 0
            description: Completion / output token count for the turn, or null if unknown.
          cache_read:
            type: ["integer", "null"]
            minimum: 0
            description: Optional cache-read token count.
          cache_write:
            type: ["integer", "null"]
            minimum: 0
            description: Optional cache-write token count.
      user_request:
        type: string
      requested_model:
        type: string
      chosen_variant:
        type: string
        description: >-
          primary | alternative-N | follow-up | rejected | unknown | custom label.
          Describes how this turn relates to the previous answer, as indicated by
          the current user message.
      used_model:
        type: string
      model_variant:
        type: string
        description: >-
          Model variant / reasoning effort used for this turn, e.g. high, max,
          low, default. Omit when the host does not expose one.
      cost:
        type: object
        required: [usd]
        additionalProperties: false
        properties:
          usd:
            type: ["number", "null"]
            minimum: 0
          note:
            type: string
      outcome:
        type: string
      files_touched:
        type: array
        items:
          type: string
      tags:
        type: array
        items:
          type: string
